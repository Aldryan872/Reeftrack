<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="../src/assets/css/style.css" />
  <style>
    .login-card.wide { max-width: 440px; }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    @media(max-width:480px){ .two-col{ grid-template-columns:1fr; } }
    .terms { font-size:11px; color:var(--text-muted); line-height:1.5; margin-top:2px; }
    .terms a { color:var(--text); font-weight:600; text-decoration:underline; text-underline-offset:2px; }
  </style>
</head>
<body>

  <div class="login-wrapper" style="max-width: 440px;">
    <div class="login-card">

      <!-- Header -->
      <div class="login-header" style="text-align:center; border-bottom:1px solid var(--border); padding-bottom:16px; margin-bottom:20px;">
        <h1>Create account</h1>
      </div>

      <!-- Form -->
      <form class="login-form" onsubmit="handleCreate(event)">

        <div class="two-col">
          <div class="input-group">
            <label for="firstname">First name</label>
            <div class="input-field" id="firstname-field">
              <i class="ph ph-user"></i>
              <input type="text" id="firstname" placeholder="Juan" required />
            </div>
            <span class="error-msg"><i class="ph ph-warning-circle"></i> Required</span>
          </div>
          <div class="input-group">
            <label for="lastname">Last name</label>
            <div class="input-field" id="lastname-field">
              <i class="ph ph-user"></i>
              <input type="text" id="lastname" placeholder="Dela Cruz" required />
            </div>
            <span class="error-msg"><i class="ph ph-warning-circle"></i> Required</span>
          </div>
        </div>

        <div class="input-group">
          <label for="email">Email address</label>
          <div class="input-field" id="email-field">
            <i class="ph ph-envelope"></i>
            <input type="email" id="email" placeholder="name@company.com" required autocomplete="email" />
          </div>
          <span class="error-msg"><i class="ph ph-warning-circle"></i> Valid email required</span>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-field" id="password-field">
            <i class="ph ph-lock"></i>
            <input type="password" id="password" placeholder="At least 6 characters" required autocomplete="new-password" />
            <button type="button" class="toggle-password" onclick="togglePass('password','eye1')" aria-label="Toggle">
              <i class="ph ph-eye" id="eye1"></i>
            </button>
          </div>
          <span class="error-msg"><i class="ph ph-warning-circle"></i> Min 6 characters</span>
        </div>

        <div class="input-group">
          <label for="confirm">Confirm password</label>
          <div class="input-field" id="confirm-field">
            <i class="ph ph-lock-key"></i>
            <input type="password" id="confirm" placeholder="Repeat password" required autocomplete="new-password" />
            <button type="button" class="toggle-password" onclick="togglePass('confirm','eye2')" aria-label="Toggle">
              <i class="ph ph-eye" id="eye2"></i>
            </button>
          </div>
          <span class="error-msg"><i class="ph ph-warning-circle"></i> Passwords do not match</span>
        </div>

        <label class="checkbox" style="align-items:flex-start; margin-top:2px;">
          <input type="checkbox" id="terms" required style="margin-top:2px;" />
          <span class="terms">I agree to the <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</span>
        </label>

        <button type="submit" class="btn-primary" id="submitBtn">
          Create account
          <i class="ph ph-arrow-right"></i>
        </button>
      </form>

      <p class="login-footer">
        Already have an account? <a href="../index.html">Sign in</a>
      </p>

    </div>
  </div>

  <script>
    function togglePass(inputId, iconId){
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      const isPass = input.type === 'password';
      input.type = isPass ? 'text' : 'password';
      icon.className = isPass ? 'ph ph-eye-slash' : 'ph ph-eye';
    }

    function handleCreate(e){
      e.preventDefault();
      const fn = document.getElementById('firstname').value.trim();
      const ln = document.getElementById('lastname').value.trim();
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const terms = document.getElementById('terms').checked;

      const fields = ['firstname','lastname','email','password','confirm'];
      fields.forEach(id => document.getElementById(id+'-field').classList.remove('error'));
      let valid = true;

      if(!fn) { document.getElementById('firstname-field').classList.add('error'); valid=false; }
      if(!ln) { document.getElementById('lastname-field').classList.add('error'); valid=false; }
      if(!email.includes('@')) { document.getElementById('email-field').classList.add('error'); valid=false; }
      if(pass.length < 6) { document.getElementById('password-field').classList.add('error'); valid=false; }
      if(confirm !== pass || !confirm) { document.getElementById('confirm-field').classList.add('error'); valid=false; }
      if(!terms) { alert('Please agree to Terms & Privacy'); valid=false; }

      if(valid){
        const btn = document.getElementById('submitBtn');
        const orig = btn.innerHTML;
        btn.innerHTML = '<i class="ph ph-circle-notch" style="animation:spin 1s linear infinite"></i> Creating...';
        btn.disabled = true;
        localStorage.setItem('admin_user', email);
        localStorage.setItem('admin_name', fn + ' ' + ln);
        setTimeout(()=> {
          window.location.href = 'dashboard.html';
        }, 900);
      }
    }

    const style = document.createElement('style');
    style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
    document.head.appendChild(style);
  </script>
</body>
</html>
