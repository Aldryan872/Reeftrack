<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="../src/assets/css/style.css" />
  <style>
    /* Extra flat styles para sa forgot page */
    .success-box {
      display: none;
      border: 1px solid #bbf7d0;
      background: #f0fdf4;
      border-radius: 6px;
      padding: 12px 14px;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 4px;
    }
    .success-box.show { display: flex; }
    .success-box .ph { color: #16a34a; font-size: 18px; flex-shrink: 0; margin-top: 1px; }
    .success-box strong { font-size: 13px; color: #15803d; display:block; }
    .success-box p { font-size: 12px; color: #166534; line-height:1.4; margin-top:2px; }
    .back-link {
      display:inline-flex;
      align-items:center;
      gap:6px;
      font-size:12px;
      font-weight:500;
      color: var(--text-muted);
      text-decoration:none;
      margin-bottom: 16px;
      border:1px solid var(--border);
      padding:6px 10px;
      border-radius:6px;
      background:white;
    }
    .back-link:hover { background: var(--surface-hover); color: var(--text); }
    .back-link .ph { font-size:14px; }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      
      <div class="login-header" style="text-align:center; border-bottom:none; padding-bottom:0; margin-bottom:20px;">
        <h1>Reset your password</h1>
        <p>Enter your email and check your inbox for instructions. Please also check your spam folder.</p>
      </div>

      <div class="success-box" id="successBox">
        <i class="ph ph-check-circle"></i>
        <div>
          <strong>Check your email</strong>
          <p>We sent a password reset link to <span id="sentEmail" style="font-weight:600;"></span>. The link will expire in 15 minutes.</p>
          <p style="margin-top:8px;"><a href="../index.html" style="color:#15803d; font-weight:600; text-decoration:underline;">Back to login</a> • <a href="#" onclick="resend(event)" style="color:#15803d; font-weight:600; text-decoration:underline;">Resend</a></p>
        </div>
      </div>

      <form class="login-form" id="forgotForm" onsubmit="handleForgot(event)">
        <div class="input-group">
          <label for="email">Email address</label>
          <div class="input-field" id="email-field">
            <i class="ph ph-envelope"></i>
            <input type="email" id="email" placeholder="name@gmail.com" required autocomplete="email" />
          </div>
          <span class="error-msg"><i class="ph ph-warning-circle"></i> Please enter a valid email</span>
        </div>



        <button type="submit" class="btn-primary" id="submitBtn">
          Send
        </button>

        <p style="font-size:11px; color:var(--text-light); text-align:center; line-height:1.5;">
          Remember your password? <a href="../index.html" style="color:var(--text); font-weight:600; text-decoration:underline; text-underline-offset:3px;">Sign in</a>
        </p>
      </form>

    </div>
  </div>

  <script>
    function handleForgot(e){
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const field = document.getElementById('email-field');
      const btn = document.getElementById('submitBtn');
      const form = document.getElementById('forgotForm');
      const box = document.getElementById('successBox');

      field.classList.remove('error');
      if(!email.includes('@')){
        field.classList.add('error');
        return;
      }

      const original = btn.innerHTML;
      btn.innerHTML = '<i class="ph ph-circle-notch" style="animation:spin 1s linear infinite"></i> Sending...';
      btn.disabled = true;

      setTimeout(()=>{
        document.getElementById('sentEmail').textContent = email;
        box.classList.add('show');
        form.style.display = 'none';
        btn.innerHTML = original;
        btn.disabled = false;
      }, 900);
    }

    function resend(e){
      e.preventDefault();
      alert('Reset link resent!');
    }

    const style = document.createElement('style');
    style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
    document.head.appendChild(style);
  </script>
</body>
</html>
